name: Release macOS artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Find latest successful macOS Universal run
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/macos.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful workflow run found"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using workflow run: $RUN_ID"

      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir artifact

          gh run download "${{ steps.find-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "ZapretMac-macOS-universal" \
            --dir artifact

          ls -la artifact

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -p artifact/ZapretMac-macOS-universal.zip ZapretMac.app/Contents/Info.plist > /tmp/ZapretMac-Info.plist
          APP_VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("/tmp/ZapretMac-Info.plist", "rb"))["CFBundleShortVersionString"])')
          TAG_VERSION=$(printf '%s' '${{ inputs.tag }}' | sed -E 's/^[vV]//; s/-.*$//')

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "App version $APP_VERSION does not match tag ${{ inputs.tag }}"
            exit 1
          fi

          gh release create "${{ inputs.tag }}" \
            artifact/ZapretMac-macOS-universal.zip \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.tag }}" \
            --generate-notes
