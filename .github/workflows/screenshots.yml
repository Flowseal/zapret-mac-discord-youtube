name: Screenshots

# Renders the real macOS HUD (NimbusHUDView) and the Windows panel to PNG for docs/screenshots.
on:
  pull_request:
    paths: ['macos/App/NimbusHUD.swift', 'macos/App/NimbusDesign.swift', 'macos/Screenshots/**', 'windows/src/Nimbus/**', '.github/workflows/screenshots.yml']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Render macOS HUD
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun swiftc -O -parse-as-library -sdk "$SDK" -target arm64-apple-macos14.0 \
            -framework AppKit -framework SwiftUI -framework QuartzCore \
            macos/App/NimbusDesign.swift macos/App/NimbusHUD.swift macos/App/NimbusSupport.swift macos/Screenshots/RenderHUD.swift -o render-hud
          ./render-hud screens
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screens/
